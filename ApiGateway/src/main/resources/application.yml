server:
  port: 8071

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8079/eureka/
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true  # Allows access to the H2 console from external applications
        web-allow-frames: true

